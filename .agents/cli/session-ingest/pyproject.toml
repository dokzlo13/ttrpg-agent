[project]
name = "session-ingest"
version = "0.1.0"
description = "Turn a craig-stt recording dataset into a searchable transcript, a recap draft, and one structured session record."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "craig-stt-dataset",
    "openai>=1.109,<2",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0",
]

[project.scripts]
session-ingest = "session_ingest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_ingest"]

# Pinned by SHA — no tags exist upstream yet. When a `dataset-v1.0.0` tag is
# pushed, swap `rev` -> `tag` here AND in .agents/cli/craig-stt (which takes the
# transcription CLI from the same commit) in one change set, then relock both
# and re-run tests/test_sdk_contract.py.
[tool.uv.sources]
craig-stt-dataset = { git = "https://github.com/dokzlo13/craig-stt", rev = "768de46ac9b1caebb32e2f9cda8531e1a300bc4f", subdirectory = "packages/craig-stt-dataset" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

# --- Ruff: lint + format --------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
    "C4",   # comprehensions
    "TID",  # tidy imports
]
ignore = [
    "E501",  # line too long — handled by formatter, not blocked
    "B008",  # function-call default (click decorators)
    "SIM108",  # ternary noise; sometimes the if/else reads better
    "RUF001",  # ambiguous en-dash / Cyrillic lookalikes; intentional in user-facing strings
    "RUF002",  # docstring en-dash; same
    "RUF003",  # comment en-dash; same
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["session_ingest"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy: type checking --------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src/session_ingest", "tests"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
show_column_numbers = true
pretty = true

# craig-stt-dataset is fully typed but ships no py.typed marker yet; the
# consumer contract test is what actually guards its surface for us.
# pymorphy3 and its dictionary package predate `py.typed`; `morphs.py` keeps the
# analyzer behind `Any` and the probe test pins the behaviour we rely on.
[[tool.mypy.overrides]]
module = ["yaml", "click", "craig_stt_dataset", "pymorphy3", "pymorphy3_dicts_ru"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# --- Pytest --------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
