[project]
name = "vault-sync"
version = "0.1.0"
description = "Safe, explicit copies from imports/source-vault/ to vault/notes/ with no semantic routing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
]

[project.scripts]
vault-sync = "vault_sync.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_sync"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# Each tool is its own isolated project with its own venv, so it needs its own
# pytest config. Without this, running pytest from the repository root picks up
# the root pytest.ini — whose testpaths point at book-ingest — and collection
# fails against a venv that has no book_ingest module.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
