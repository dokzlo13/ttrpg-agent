; Root convenience config: a bare `pytest` at the repository root runs the
; book-ingest suite. Each tool under .agents/cli/ is an isolated project with
; its own venv, so the other suites cannot run from this config — they carry
; their own [tool.pytest.ini_options] and are invoked per project:
;
;   uv run --project .agents/cli/book-ingest pytest
;   uv run --project .agents/cli/vault-sync   pytest .agents/cli/vault-sync/tests
;
; The explicit path in the second command matters: an argument overrides
; `testpaths` below, which would otherwise aim vault-sync's venv at
; book-ingest's suite and fail collection.
;
[pytest]
testpaths = .agents/cli/book-ingest/tests
python_files = test_*.py
addopts = -q
